<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}NER Landslide Watch{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <span class="mark">SIH26001</span>
      <span>
        <strong>NER Landslide Watch</strong>
        <small>AI early warning for the North Eastern Region</small>
      </span>
    </a>
    <nav>
      <a href="/" class="{{ 'on' if request.path == '/' else '' }}">Live map</a>
      <a href="/how-it-works" class="{{ 'on' if request.path == '/how-it-works' else '' }}">How the AI works</a>
      <a href="/learn" class="{{ 'on' if request.path == '/learn' else '' }}">Learn step by step</a>
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
  <footer>
    Ministry of Development of North Eastern Region · Disaster Management · Software demo for beginners
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
